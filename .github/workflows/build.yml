name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build with Gradle
        run: chmod +x gradlew && ./gradlew test jar apiJar -Porg.gradle.dependency.verification.console=verbose

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: princeps-build-verification
          path: |
            build/reports/dependency-verification/
            build/reports/minecraft-input-verification.json
            build/test-results/test/
            build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: princeps-fabric-mc26.1
          path: build/libs/*.jar
